name: OpenPrompter
options:
  bundleIdPrefix: us.seelye.openprompter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
  # Treat Icon Composer `.icon` bundles as opaque files. Without this,
  # XcodeGen explodes the bundle into its contents (icon.json + PNGs) and
  # Xcode stops recognizing it as an app icon. (XcodeGen issue #1556.)
  fileTypes:
    icon:
      file: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: C36262555P
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.4.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"

targets:
  OpenPrompter:
    type: application
    platform: iOS
    sources:
      - path: OpenPrompter
        excludes:
          - OpenPrompter.entitlements
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
      # Icon Composer app icon (Liquid Glass, iOS 26/27). `type: file` keeps
      # the .icon bundle as ONE resource instead of exploding it into
      # icon.json + PNGs (XcodeGen #1556). actool compiles it, and
      # ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon resolves to it on iOS 26+.
      # The flat AppIcon.appiconset is KEPT as the iOS 17/18 fallback
      # (Apple known issue 152258860 — .icon back-deploys with broken render).
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    resources:
      - path: OpenPrompter/Resources/welcome.md
      - path: OpenPrompter/Resources/demo-everything.md
      - path: OpenPrompter/Resources/Assets.xcassets
      - path: OpenPrompter/Resources/Fonts
      - path: OpenPrompter/Resources/PrivacyInfo.xcprivacy
      # Voice-tracking debug audio sample. DEBUG-only; bundled so the
      # Settings → Labs replay button can drive SFSpeechRecognizer
      # from a known recording without going through the live mic.
      - path: OpenPrompter/Resources/voice-tracking-test-sample.m4a
    info:
      path: OpenPrompter/Resources/Info.plist
      properties:
        CFBundleDisplayName: Open Prompter
        CFBundleName: Open Prompter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # TRUE as of 3.1, when iPad shipped.
        #
        # `false` opts into iPad multitasking, which Apple requires be paired
        # with ALL FOUR orientations — and omitting PortraitUpsideDown emits
        # "All interface orientations must be supported unless the app requires
        # full screen", i.e. ITMS-90474 at upload. Verified by A/B: the warning
        # appears only with TARGETED_DEVICE_FAMILY "1,2".
        #
        # We do NOT fix that by adding PortraitUpsideDown, because
        # `RotationCoordinatorBox.interfaceIsPortrait()` reads
        # `currentPhysicalHold()`, which folds upside-down INTO `.portrait`.
        # Supporting the orientation without splitting that first would latch
        # the portrait rotation reference against a 180°-rotated interface, and
        # a subsequent landscape take would come out 180° from correct — the
        # exact double-rotation class 3.1 exists to eliminate.
        #
        # Requiring full screen is also the honest product answer: a
        # teleprompter is a full-screen instrument. Split View is revisitable
        # in 3.2 alongside a real `.portraitUpsideDown` hold case.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSDocumentsFolderUsageDescription: "Open Prompter reads the markdown files in the folder you pick so they can appear as teleprompter scripts."
        NSCameraUsageDescription: "Open Prompter shows your camera in a small tile or behind the script while you read. Camera footage is never recorded unless you press record."
        # Cross-feature mic copy — V2 Design 01 §"Microphone — cross-feature
        # coordination". Recording AND voice tracking will both use this
        # permission once Feature 5 lands; the prompt mentions both so the
        # user makes one informed decision.
        NSMicrophoneUsageDescription: "Open Prompter records audio with your video and follows along with your reading on-device. Audio is processed locally and never leaves your device."
        # Photos write-only scope — the recording feature saves new videos
        # directly to the user's library (Recents). We never request the
        # broader read permission (`NSPhotoLibraryUsageDescription`); a
        # previous version tried to maintain a custom "Open Prompter" album
        # but album-enumeration via `PHAssetCollection.fetchAssetCollections`
        # is a READ operation that crashes apps with only `addOnly` scope on
        # iOS 26. Dropping the album keeps us strictly write-only.
        NSPhotoLibraryAddUsageDescription: "Open Prompter saves your finished recordings to Photos so you can edit and share them."
        # Speech recognition — V2 Feature 5 voice-tracked auto-scroll.
        # Surfaces a SEPARATE iOS prompt from the mic permission above
        # the first time the user taps the voice button. Speech is
        # processed on-device only (`requiresOnDeviceRecognition = true`).
        NSSpeechRecognitionUsageDescription: "Open Prompter listens to your reading and scrolls the script in time. Speech is processed on this device and never leaves it."
        # Live Activities — required so the recording chip can post a
        # `Activity.request(...)` for the Dynamic Island indicator.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - Lexend-Regular.ttf
          - Lexend-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.seelye.openprompter.ios
        # 1 = iPhone, 2 = iPad. iPad added in 3.2: an iPad on a teleprompter
        # mount is the classic studio rig, and it also unlocks running natively
        # on Apple Silicon Macs as a "Designed for iPad" app.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Strip DEBUG-only test fixtures from App Store builds. The
          # voice-tracking sample audio (1.2 MB) is only consumed by
          # the DEBUG-gated Settings → Labs replay row; bundling it
          # in Release would ship dead weight to production.
          EXCLUDED_SOURCE_FILE_NAMES: voice-tracking-test-sample.m4a
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: swift-collections
        product: Collections
      # Live Activity widget extension. XcodeGen embeds this into the main
      # app bundle when `embed: true` (the default for app-extension types).
      - target: OpenPrompterLiveActivity

  # Widget Extension target hosting the Live Activity for the recording
  # feature. Shares `PrompterRecordingAttributes.swift` with the main app
  # via the explicit `path:` entry in `sources:` below — XcodeGen
  # materializes the file into both build graphs without duplication.
  OpenPrompterLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: OpenPrompterLiveActivity
      - path: OpenPrompter/Features/Recording/PrompterRecordingAttributes.swift
    info:
      path: OpenPrompterLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Open Prompter
        CFBundleName: Open Prompter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.seelye.openprompter.ios.liveactivity
        # 1 = iPhone, 2 = iPad. iPad added in 3.2: an iPad on a teleprompter
        # mount is the classic studio rig, and it also unlocks running natively
        # on Apple Silicon Macs as a "Designed for iPad" app.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO

  OpenPrompterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenPrompterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.seelye.openprompter.ios.tests
        # 1 = iPhone, 2 = iPad. iPad added in 3.2: an iPad on a teleprompter
        # mount is the classic studio rig, and it also unlocks running natively
        # on Apple Silicon Macs as a "Designed for iPad" app.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OpenPrompter

schemes:
  OpenPrompter:
    build:
      targets:
        OpenPrompter: all
        OpenPrompterTests: [test]
    test:
      targets:
        - OpenPrompterTests
      gatherCoverageData: true
