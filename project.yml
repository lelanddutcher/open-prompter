name: OpenPrompter
options:
  bundleIdPrefix: app.openprompter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.4.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"

targets:
  OpenPrompter:
    type: application
    platform: iOS
    sources:
      - path: OpenPrompter
        excludes:
          - OpenPrompter.entitlements
          - Resources/Info.plist
    resources:
      - path: OpenPrompter/Resources/welcome.md
      - path: OpenPrompter/Resources/demo-everything.md
      - path: OpenPrompter/Resources/Assets.xcassets
      - path: OpenPrompter/Resources/Fonts
    info:
      path: OpenPrompter/Resources/Info.plist
      properties:
        CFBundleDisplayName: Open Prompter
        CFBundleName: Open Prompter
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSDocumentsFolderUsageDescription: "Open Prompter reads the markdown files in the folder you pick so they can appear as teleprompter scripts."
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - Lexend-Regular.ttf
          - Lexend-Bold.ttf
    entitlements:
      path: OpenPrompter/OpenPrompter.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.openprompter.ios
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.app.openprompter.ios
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)app.openprompter.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openprompter.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: OpenPrompter/OpenPrompter.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: swift-collections
        product: Collections

  OpenPrompterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenPrompterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openprompter.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OpenPrompter

schemes:
  OpenPrompter:
    build:
      targets:
        OpenPrompter: all
        OpenPrompterTests: [test]
    test:
      targets:
        - OpenPrompterTests
      gatherCoverageData: true
